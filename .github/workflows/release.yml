name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: anydoc-cli-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: anydoc-cli-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: anydoc-cli-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: anydoc-cli-windows-x86_64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          bin_name="anydoc-cli${{ matrix.ext }}"
          src="target/${{ matrix.target }}/release/${bin_name}"
          dest="${{ matrix.artifact }}${{ matrix.ext }}"
          cp "$src" "$dest"
          sha256sum "$dest" > "${dest}.sha256" 2>/dev/null || shasum -a 256 "$dest" > "${dest}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}${{ matrix.ext }}
            ${{ matrix.artifact }}${{ matrix.ext }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
