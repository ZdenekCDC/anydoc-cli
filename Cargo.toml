[package]
name = "anydoc-cli"
version = "0.2.0"
edition = "2024"
description = "Standalone CLI that converts Office/PDF/EPUB documents to Markdown, powered by the anydoc crate"
license = "MIT"
repository = "https://github.com/ZdenekCDC/anydoc-cli"

[dependencies]
anydoc = "0.2.1"
clap = { version = "4", features = ["derive"] }
